<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0"
          name="viewport"/>
    <title>Login -
        Inventory
        Manager</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin: 0 0 0.5rem;
            text-align: center;
        }

        p.subtitle {
            margin: 0 0 1.5rem;
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-error {
            background: #fee2e2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .alert-success {
            background: #dcfce7;
            color: var(--success);
            border: 1px solid #86efac;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 1.2rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        input {
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .hint {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Sign In</h2>
    <p class="subtitle">
        Access your
        Product
        Inventory</p>

    <div class="alert alert-error"
         id="errorAlert">
        Invalid username
        or password.
    </div>
    <div class="alert alert-success"
         id="logoutAlert">
        You have been
        logged out.
    </div>

    <form action="/login"
          method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input autofocus
                   id="username"
                   name="username"
                   required
                   type="text"/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password"
                   name="password"
                   required
                   type="password"/>
        </div>

        <button type="submit">
            Log In
        </button>
    </form>

    <div class="hint">
        Default
        credentials:
        <strong>admin</strong>
        / <strong>admin123</strong>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) {
        document.getElementById('errorAlert').style.display = 'block';
    }
    if (params.has('logout')) {
        document.getElementById('logoutAlert').style.display = 'block';
    }
</script>
</body>
</html>
